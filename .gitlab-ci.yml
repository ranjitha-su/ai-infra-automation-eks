default:
  image:
    name: hashicorp/terraform:1.14
    entrypoint: [""]
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - apk add --no-cache aws-cli
    - >
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity
      --role-arn ${ROLE_ARN}
      --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
      --web-identity-token ${GITLAB_OIDC_TOKEN}
      --duration-seconds 3600
      --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
      --output text))
    - aws sts get-caller-identity

stages:
  - init
  - validate
  - plan
  - apply
  - destroy

variables:
  TF_IN_AUTOMATION: "true"
  AWS_DEFAULT_REGION: "us-west-2"
  # Set the following as masked CI/CD variables in GitLab project settings:
  # ROLE_ARN
  # TF_VAR_external_aws_k8s_admin_principal_arn
  # TF_VAR_external_aws_k8s_developer_principal_arn
  # TF_VAR_external_aws_k8s_developer_namespaces  (JSON list e.g. '["dev","staging"]')

# ── Init ────────────────────────────────────────────────────────────────────

init:
  stage: init
  script:
    - terraform init -input=false
  artifacts:
    paths:
      - .terraform
      - .terraform.lock.hcl
    expire_in: 1 hour

# ── Validate ────────────────────────────────────────────────────────────────

validate:
  stage: validate
  dependencies:
    - init
  script:
    - terraform validate
  rules:
    - changes:
        - "**/*"

# ── Plan ────────────────────────────────────────────────────────────────────

plan:
  stage: plan
  dependencies:
    - init
  script:
    - terraform plan -input=false -out=tfplan
  artifacts:
    name: tfplan
    paths:
      - tfplan
    expire_in: 1 week
  rules:
    - changes:
        - "**/*"

# ── Apply ───────────────────────────────────────────────────────────────────

apply:
  stage: apply
  dependencies:
    - plan
  script:
    - terraform init -input=false
    - terraform apply -input=false tfplan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "**/*"
      when: manual

# ── Destroy ─────────────────────────────────────────────────────────────────

destroy:
  stage: destroy
  script:
    - terraform init -input=false
    - terraform destroy -auto-approve -input=false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment:
    name: production
    action: stop
